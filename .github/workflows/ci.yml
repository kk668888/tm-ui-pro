name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # changesets status 要执行 `git merge-base master HEAD` 定位分歧点。
          # 默认（depth=1 且只取 PR 的 merge ref）既没有 master 引用、也没有可供
          # 计算 merge-base 的历史，会报 "Failed to find where HEAD diverged from master"。
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests + coverage thresholds (@kibus/tm-ui-plus)
        run: pnpm test:coverage

      - name: Demo tests
        run: pnpm --filter demo test

      - name: Build @kibus/tm-ui-plus
        run: pnpm build:ui

      - name: Build demo
        run: pnpm build:demo

      - name: Build docs
        run: pnpm build:docs

      - name: Changeset status
        run: |
          # changesets 解析的 baseBranch 是裸名 "master"（不会回退到 origin/master），
          # 所以本地必须有该引用。但两个触发场景的 HEAD 状态不同：
          #   PR        → checkout 在 detached HEAD，无 master，需补建
          #   push 主干 → HEAD 就是 master，git 会拒绝 fetch 进已检出的分支（exit 128）
          # 故仅在缺引用时补建。
          if ! git rev-parse --verify --quiet refs/heads/master >/dev/null; then
            git fetch --no-tags origin '+refs/heads/master:refs/heads/master'
          fi
          pnpm changeset status
