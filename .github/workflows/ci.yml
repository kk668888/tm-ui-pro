name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # changesets status 要执行 `git merge-base master HEAD` 定位分歧点。
          # 默认（depth=1 且只取 PR 的 merge ref）既没有 master 引用、也没有可供
          # 计算 merge-base 的历史，会报 "Failed to find where HEAD diverged from master"。
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests + coverage thresholds (@trustmo/tm-ui)
        run: pnpm test:coverage

      - name: Demo tests
        run: pnpm --filter demo test

      - name: Build @trustmo/tm-ui
        run: pnpm build:ui

      - name: Build demo
        run: pnpm build:demo

      - name: Build docs
        run: pnpm build:docs

      - name: Changeset status
        run: |
          # actions/checkout 只取 PR 的 merge ref，不会建本地 master 分支；
          # 而 changesets 解析的 baseBranch 就是裸名 "master"，故显式补一个
          git fetch --no-tags origin '+refs/heads/master:refs/heads/master'
          pnpm changeset status
