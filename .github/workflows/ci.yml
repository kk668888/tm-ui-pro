name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests + coverage thresholds (@kibus/tm-ui-plus)
        run: pnpm test:coverage

      - name: Demo tests
        run: pnpm --filter demo test

      - name: Build @kibus/tm-ui-plus
        run: pnpm build:ui

      - name: Build demo
        run: pnpm build:demo

      - name: Build docs
        run: pnpm build:docs

      - name: Changeset status
        run: pnpm changeset status
