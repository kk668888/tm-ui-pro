# pnpm-workspace.yaml
# Monorepo 工作区声明：声明哪些目录下的子包参与 workspace 协议
# 后续 task 将创建：
#   - packages/ui：@tm/ui 组件库（核心库，零应用依赖）
#   - apps/docs：@tm/docs 文档站（基于 VitePress）
packages:
  - 'packages/*'
  - 'apps/*'
# allowBuilds：pnpm 11 的 install 期 build script 审批表（true 允许执行，false 显式忽略）
# pnpm 11 默认 strictDepBuilds=true，未在此显式声明的包会触发 ERR_PNPM_IGNORED_BUILDS
# 阻断 `pnpm --filter` 子包脚本的预检；故将以下包显式标记为 false：
# - core-js：postinstall 仅为兼容性提示，无需执行
# - esbuild：在 Windows/Linux/macOS 均通过 optionalDependencies 投放预编译二进制，无需 build script
# - vue-demi：postinstall 用于切换 Vue 2/3 入口；本项目固定 Vue 3.5，运行时由 peer 自动解析
allowBuilds:
  core-js: false
  esbuild: false
  vue-demi: false
